name: 'AI Code Reviewer'
description: 'Reviews GitHub PRs using Anthropic, OpenAI, or GitHub Copilot and posts inline comments.'

inputs:
  version:
    description: 'PyPI version for Anthropic/OpenAI. Copilot installs from this action revision.'
    required: false
    default: '0.1.10'
  model:
    description: 'AI model provider: anthropic, openai, or copilot'
    required: false
    default: 'anthropic'
  github-token:
    description: 'GitHub token with pull-request write permissions and, for Copilot, copilot-requests write'
    required: true
  anthropic-api-key:
    description: 'Anthropic API key (required when model is anthropic)'
    required: false
    default: ''
  openai-api-key:
    description: 'OpenAI API key (required when model is openai)'
    required: false
    default: ''
  guidelines:
    description: 'Path to a Markdown guidelines file relative to repository root. Overrides config file.'
    required: false
    default: ''
  config-path:
    description: 'Path to .prlens.yml config file relative to repository root'
    required: false
    default: '.prlens.yml'
  full-review:
    description: 'Set to "true" to review all files even if a previous review exists'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Validate Copilot workflow safety
      if: inputs.model == 'copilot'
      shell: bash
      env:
        PRLENS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PRLENS_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        PRLENS_REPOSITORY: ${{ github.repository }}
      run: |
        if [ "$PRLENS_HEAD_REPOSITORY" != "$PRLENS_REPOSITORY" ]; then
          echo "::error::Copilot reviews of pull requests from forks are disabled."
          exit 1
        fi
        if [ -z "$PRLENS_BASE_SHA" ] || [ "$(git rev-parse HEAD)" != "$PRLENS_BASE_SHA" ]; then
          echo "::error::Copilot requires the workspace to be checked out at the pull request base SHA."
          exit 1
        fi

    - name: Install prlens
      if: inputs.model != 'copilot'
      shell: bash
      run: pip install "prlens[${{ inputs.model }}]==${{ inputs.version }}"

    - name: Install prlens with Copilot support
      if: inputs.model == 'copilot'
      shell: bash
      env:
        PRLENS_ACTION_PATH: ${{ github.action_path }}
      run: |
        action_root="$(cd "$PRLENS_ACTION_PATH/../../.." && pwd)"
        pip install \
          "$action_root/packages/core[copilot]" \
          "$action_root/packages/store" \
          "$action_root/packages/cli"
        python -m copilot download-runtime

    - name: Run code review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
      run: |
        prlens review \
          --repo "${{ github.repository }}" \
          --pr "${{ github.event.pull_request.number }}" \
          --model "${{ inputs.model }}" \
          --config "${{ inputs.config-path }}" \
          ${{ inputs.guidelines && format('--guidelines "{0}"', inputs.guidelines) || '' }} \
          ${{ inputs.full-review == 'true' && '--full-review' || '' }} \
          --yes
